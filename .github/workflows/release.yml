name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/check-release.ps1 -Version "${GITHUB_REF_NAME#v}"

      - name: Create extension ZIP (Chrome / Edge / Brave)
        run: |
          cd extension
          zip -r ../claude-counter-${GITHUB_REF_NAME#v}.zip .

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: claude-counter-*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
